# Copy this file into a GitHub repo you own as:
#   .github/workflows/lotto.yml
#
# It fetches the Lotterywest API every 15 minutes and commits the JSON to
# `data/lotto.json`. Then in this Lovable project, set the env var
#   VITE_LOTTO_JSON_URL=https://raw.githubusercontent.com/<user>/<repo>/main/data/lotto.json
# and the site will read from GitHub instead of corsproxy.io.
#
# Notes:
#  - The runner reaches Lotterywest server-to-server, so there is no CORS issue.
#  - raw.githubusercontent.com serves permissive CORS headers, so the browser
#    can read the JSON directly.
#  - Free GitHub Actions minutes are plenty for a 15-minute cron.

name: Sync Lotterywest results

on:
  schedule:
    # GitHub 的 schedule 在高峰期经常被延迟甚至跳过，所以设成每 5 分钟一次，
    # 并且在同一次运行里循环抓取多轮，减少「整段时间没更新」的概率。
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lotto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Fetch and commit (multiple passes)
        run: |
          set -euo pipefail
          git config user.name  "lotto-sync-bot"
          git config user.email "lotto-sync-bot@users.noreply.github.com"
          mkdir -p data

          fetch_once() {
            for attempt in 1 2 3; do
              if curl -fsSL --max-time 30 \
                -H "accept: application/json" \
                -H "user-agent: Mozilla/5.0 (github-actions lotto-sync)" \
                "https://www.lotterywest.wa.gov.au/api/games" \
                -o /tmp/lotto.json; then
                if python3 -c "import json; json.load(open('/tmp/lotto.json'))"; then
                  cp /tmp/lotto.json data/lotto.json
                  return 0
                fi
              fi
              echo "attempt $attempt failed, retrying..."
              sleep 10
            done
            return 1
          }

          # 5 轮 x 每轮间隔 60 秒 ≈ 覆盖 5 分钟，衔接下一次 cron。
          for i in 1 2 3 4 5; do
            if fetch_once; then
              if [[ -n "$(git status --porcelain data/lotto.json)" ]]; then
                git add data/lotto.json
                git commit -m "chore: refresh lotto data ($(date -u +%FT%TZ))"
                git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
                git push
              else
                echo "No changes (pass $i)."
              fi
            else
              echo "Fetch failed (pass $i)."
            fi
            [[ $i -lt 5 ]] && sleep 60 || true
          done

